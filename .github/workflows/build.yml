name: Build MCREZIL GAMES APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable

      - name: Restore our files
        run: |
          cp lib/main.dart /tmp/main.dart
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || echo "no manifest"
          rm -rf android ios web
          flutter create. --project-name mcrezil_game_labs --org com.mcrezil --platforms android
          cp /tmp/main.dart lib/main.dart
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: MCREZIL-APK-v3.2.1
          path: build/app/outputs/flutter-apk/app-release.apk
