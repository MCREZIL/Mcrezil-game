name: MCREZIL Live Website
on: push
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0' }
      - run: flutter config --enable-web
      - name: Restore web folder
        run: |
          if [ ! -f web/index.html ]; then
            flutter create --project-name mcrezil_game . --platforms web
          fi
      - run: flutter pub get
      - run: flutter build web --release --base-href /Mcrezil-game/
      - uses: actions/upload-pages-artifact@v3
        with: { path: build/web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
