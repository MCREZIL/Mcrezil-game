name: Build MCREZIL APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0' }
      - name: Add mobile plugins for APK
        run: |
          flutter pub add nearby_connections permission_handler
          flutter pub get
      - name: Build APK
        run: flutter build apk --release --target lib/main_mobile.dart
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mcrezil-games-apk
          path: build/app/outputs/flutter-apk/app-release.apk
