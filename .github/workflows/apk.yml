name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.22.3'}

      - name: Fix and Build
        run: |
          rm -rf android
          flutter create . --platforms android --project-name mcrezil_game
          # Fix Kotlin ONLY - safe replace
          sed -i 's/org.jetbrains.kotlin.android" version ".*"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle
          cat android/settings.gradle
          cat > pubspec.yaml << 'EOF'
          name: mcrezil_game
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            permission_handler: ^11.3.1
            nearby_connections: ^4.3.0
          flutter:
            uses-material-design: true
          EOF
          flutter pub get
          sed -i 's/<application/<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          flutter build apk --release --target lib/main_mobile.dart --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: mcrezil-games-apk
          path: build/app/outputs/flutter-apk/app-release.apk
