name: Build MCREZIL APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Setup Android & Fix Kotlin
        run: |
          rm -rf android
          flutter create . --platforms android --project-name mcrezil_game
          
          # FIX KOTLIN VERSION 1.9.0 error
          sed -i "s/ext.kotlin_version = '1.7.1'/ext.kotlin_version = '1.9.10'/" android/build.gradle
          sed -i "s/ext.kotlin_version = '1.7.10'/ext.kotlin_version = '1.9.10'/" android/build.gradle
          sed -i "s/ext.kotlin_version = '1.8.0'/ext.kotlin_version = '1.9.10'/" android/build.gradle
          sed -i "s/id 'org.jetbrains.kotlin.android' version '1.7.1'/id 'org.jetbrains.kotlin.android' version '1.9.10'/" android/settings.gradle || true
          
          cat > pubspec.yaml << 'EOF'
          name: mcrezil_game
          description: MCREZIL GAMES OFFLINE
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            qr_flutter: ^4.1.0
            permission_handler: ^11.3.1
            nearby_connections: ^4.3.0
          flutter:
            uses-material-design: true
          EOF
          
          flutter pub get
          
          # Patch embedding + deprecated
          find $HOME/.pub-cache -name "AndroidManifest.xml" -path "*nearby_connections*" -exec sed -i 's/<application/<meta-data android:name="flutterEmbedding" android:value="2" \/>\n        <application/' {} \;
          find $HOME/.pub-cache -name "NearbyConnectionsPlugin.java" -exec sed -i 's/getAuthenticationToken()/getAuthenticationDigits()/g' {} \;

      - name: Add Bluetooth permissions
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.BLUETOOTH" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" \/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: flutter build apk --release --target lib/main_mobile.dart --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: mcrezil-games-apk
          path: build/app/outputs/flutter-apk/app-release.apk
