name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Fix Kotlin 1.7 -> 1.9.22
        run: |
          rm -rf android
          flutter create . --platforms android --project-name mcrezil_game
          
          # Force upgrade Kotlin in EVERY gradle file
          grep -r "kotlin_version" android/ || true
          find android -name "*.gradle" -type f -exec sed -i "s/1\.7\.1/1.9.22/g; s/1\.7\.10/1.9.22/g; s/1\.8\.0/1.9.22/g; s/1\.9\.0/1.9.22/g" {} \;
          sed -i "s/ext.kotlin_version.*/ext.kotlin_version = '1.9.22'/" android/build.gradle
          cat android/build.gradle | grep kotlin
          
          cat > pubspec.yaml << 'EOF'
          name: mcrezil_game
          description: MCREZIL OFFLINE
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            permission_handler: ^11.3.1
            nearby_connections: ^4.3.0
          flutter:
            uses-material-design: true
          EOF
          flutter pub get

      - name: Add permissions
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.BLUETOOTH" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" \/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - run: flutter build apk --release --target lib/main_mobile.dart --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: mcrezil-games-apk
          path: build/app/outputs/flutter-apk/app-release.apk
